# Nginx 主配置 —— 直接由 run.sh 用 nginx -c 加载
# 无需 /etc/nginx 下的站点配置
# Live ISO reset 后 nginx 默认 /var/lib/nginx/* 目录会丢失，
# 所有 temp_path / log / pid 必须硬编码到 /H 持久分区

# ⚠️ 关键：用 nginx -c 跳过了 /etc/nginx/nginx.conf，必须显式指定 worker 用户
# 否则 nginx 会用编译默认的 "nobody"，导致 uploads 目录写入 Permission denied
user www-data www-data;
worker_processes auto;

# 日志和 PID 全部指向 /H（overlay reset 不丢）
# error_log 和 pid 可以在 main 上下文
error_log  /H/aisrc/IRC/tmp/nginx_logs/error.log;
pid        /H/aisrc/IRC/tmp/nginx_logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # access_log 必须在 http/server/location 上下文，不能放 main
    # 不指定的话 nginx 默认写 /var/log/nginx/access.log（reset 后目录不存在）
    access_log  /H/aisrc/IRC/tmp/nginx_logs/access.log;

    # 指向 /H 上 bundled 的 mime.types，不用 /etc/nginx（reset 会丢）
    # 这样 run.sh 完全零 apt install 也能跑
    include       /H/aisrc/IRC/nginx-rootfs/etc/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;

    # ⚠️ 所有临时目录都指到 /H（42G ext4）
    # 默认 /var/lib/nginx/* 在 overlay tmpfs 上 reset 会丢
    # proxy_temp_path 缺失会导致 configtest 直接报:
    #   mkdir() "/var/lib/nginx/proxy" failed (2: No such file or directory)
    client_body_temp_path /H/aisrc/IRC/tmp/nginx_body;
    proxy_temp_path       /H/aisrc/IRC/tmp/nginx_proxy;
    fastcgi_temp_path     /H/aisrc/IRC/tmp/nginx_fastcgi;
    uwsgi_temp_path       /H/aisrc/IRC/tmp/nginx_uwsgi;
    scgi_temp_path        /H/aisrc/IRC/tmp/nginx_scgi;
    client_body_buffer_size 256k;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ===== 大文件传输全局参数 =====
        client_max_body_size    15G;
        client_body_timeout     3600s;
        client_header_timeout   30s;
        send_timeout            3600s;

        # 直接指向 /H 上的持久化文件，无需拷贝
        root /H/aisrc/IRC/web;
        index index.html;

        # 静态页面
        location / {
            try_files $uri $uri/ /index.html;
        }

        # WebSocket 反代到 UnrealIRCd
        location /ws {
            proxy_pass http://127.0.0.1:8067;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ===== 大文件上传 + 下载（持久化到 /H） =====
        location /uploads/ {
            alias /H/aisrc/IRC/uploads/;

            # DAV 上传能力
            dav_methods PUT DELETE MKCOL;
            create_full_put_path on;
            dav_access user:rw group:r all:r;

            # 下载优化：零拷贝 + 原生 HTTP Range 断点续传
            sendfile on;
            aio threads;
            directio 10M;
            max_ranges 10;
            expires 30d;
            add_header Cache-Control "public";
        }
    }
}
