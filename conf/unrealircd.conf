// ============================================================
// UnrealIRCd 6.x — 本地设备互通配置
// BASEPATH: /H/aisrc/IRC/unrealircd
// ============================================================

me {
    name "irc.local";
    info "Local Device IRC Network";
    sid "001";
}

admin {
    "Local Device IRC Admin";
    "ircadmin";
    "admin@irc.local";
}

// 本地监听 WebSocket (plain text, Nginx 反代用)
listen {
    ip 127.0.0.1;
    port 8067;
    options {
        websocket { type text; }
    }
}

// 本地监听 WebSocket (TLS)
listen {
    ip 127.0.0.1;
    port 8697;
    options {
        tls;
        websocket { type text; }
    }
}

// 全局设置
set {
    utf8-only yes;
    network-name "LocalNet";
    default-server "irc.local";
    maxchannelsperuser 100;
    kline-address "admin@irc.local";
    help-channel "#Help";
}

// 本地回环免限制
allow {
    mask 127.0.0.1;
    class clients;
    maxperip 100;
}

class clients {
    pingfreq 120;
    maxclients 1000;
    sendq 1M;
    recvq 8k;
}

// 加载必要模块
loadmodule "webserver";
loadmodule "websocket";
loadmodule "websocket_common";
loadmodule "cloak_none";

// 默认配置 include (相对路径自动找 BASEPATH/conf/)
include "snomasks.default.conf";
include "modules.default.conf";
