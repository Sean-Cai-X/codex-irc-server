<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地设备互通频道</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { height: 100vh; display: flex; flex-direction: column; font-family: system-ui, sans-serif; background: #fafafa; }
        #header { padding: 10px 16px; background: #1e40af; color: white; font-size: 14px; display: flex; align-items: center; gap: 12px; }
        #header h1 { font-size: 16px; font-weight: 600; }
        #status { font-size: 12px; opacity: 0.9; }
        #status.disconnected { color: #fca5a5; }
        #status.connecting { color: #fde68a; }
        #status.connected { color: #86efac; }
        #messages { flex: 1; overflow-y: auto; padding: 16px; line-height: 1.6; font-size: 14px; }
        .msg { margin-bottom: 8px; word-break: break-all; }
        .system-msg { color: #888; font-style: italic; font-size: 12px; }
        .ping-msg { color: #666; font-size: 12px; }
        .nick { font-weight: bold; margin-right: 6px; color: #2563eb; }
        .msg img { max-width: 300px; max-height: 200px; display: block; margin-top: 4px; border-radius: 4px; }
        .msg a { color: #2563eb; text-decoration: underline; }
        #input-area { display: flex; padding: 10px; border-top: 1px solid #e5e7eb; gap: 8px; background: white; }
        #nick-input { width: 140px; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        #nick-input:focus { outline: none; border-color: #2563eb; }
        #msg-input { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
        #msg-input:focus { outline: none; border-color: #2563eb; }
        button { padding: 8px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        button:hover:not(:disabled) { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .user-list { position: absolute; right: 10px; top: 50px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; font-size: 12px; display: none; max-height: 200px; overflow-y: auto; }
        /* ===== 文件上传样式 ===== */
        #status.connected::after { content: " · 拖拽上传文件"; opacity: 0.6; margin-left: 8px; font-size: 11px; }
        .file-card { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: #eff6ff; border: 1px solid #93c5fd; border-radius: 6px; margin-top: 4px; text-decoration: none; color: #1d4ed8; font-size: 13px; }
        .file-card:hover { background: #dbeafe; border-color: #3b82f6; }
        .file-size { color: #64748b; font-size: 11px; }
        #upload-area { padding: 0 16px; height: 0; overflow: hidden; transition: height 0.2s; }
        #upload-area.active { height: 24px; padding: 4px 16px; background: #f0f9ff; border-bottom: 1px solid #bae6fd; }
        #upload-progress { height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
        #upload-bar { height: 100%; width: 0%; background: #2563eb; transition: width 0.15s; }
        #upload-text { font-size: 11px; color: #0369a1; margin-top: 2px; }
        #file-btn { padding: 8px 12px; background: #64748b; font-size: 12px; }
        #file-btn:hover:not(:disabled) { background: #475569; }
        .drag-over { outline: 3px dashed #2563eb; outline-offset: -6px; background: #eff6ff !important; }
        button.primary { background: #2563eb; }
    </style>
</head>
<body>
    <div id="header">
        <h1>🔗 本地设备互通</h1>
        <span id="status" class="connecting">连接中...</span>
    </div>
    <div id="upload-area">
        <div id="upload-progress"><div id="upload-bar"></div></div>
        <div id="upload-text"></div>
    </div>
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="nick-input" placeholder="昵称" maxlength="20">
        <input type="text" id="msg-input" placeholder="输入消息，回车发送">
        <input type="file" id="file-input" style="display:none">
        <button id="file-btn" type="button">📁 上传</button>
        <button id="send-btn" type="button" disabled>发送</button>
    </div>

    <script>
        const wsUrl = `ws://${window.location.host}/ws`;
        const uploadBase = `/uploads/`;
        const channel = "#main";
        let ws = null;
        let connected = false;
        let userNicks = new Set();
        let uploading = false;

        const msgInput = document.getElementById('msg-input');
        const nickInput = document.getElementById('nick-input');
        const sendBtn = document.getElementById('send-btn');
        const fileBtn = document.getElementById('file-btn');
        const fileInput = document.getElementById('file-input');
        const messagesDiv = document.getElementById('messages');
        const statusSpan = document.getElementById('status');
        const uploadArea = document.getElementById('upload-area');
        const uploadBar = document.getElementById('upload-bar');
        const uploadText = document.getElementById('upload-text');

        // 生成默认设备昵称
        nickInput.value = "device_" + Math.floor(Math.random() * 10000);

        function setStatus(text, cls) {
            statusSpan.textContent = text;
            statusSpan.className = cls || '';
        }

        function connect() {
            setStatus("连接中...", "connecting");
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const nick = nickInput.value.trim() || "guest";
                // IRC 标准握手
                ws.send(`NICK ${nick}\r\n`);
                ws.send(`USER ${nick} 0 * :${nick}\r\n`);
            };

            ws.onmessage = (e) => {
                const lines = e.data.split(/\r?\n/).filter(l => l.length > 0).map(l => l.replace(/\r$/, ""));
                lines.forEach(parseIrcMessage);
            };

            ws.onclose = () => {
                connected = false;
                sendBtn.disabled = true;
                setStatus("已断开，3秒后重连...", "disconnected");
                setTimeout(connect, 3000);
            };

            ws.onerror = () => {
                setStatus("连接失败", "disconnected");
            };
        }

        function parseIrcMessage(line) {
            // PING 保活（必须第一个处理，WebSocket 客户端必须快速回复）
            if (line.startsWith("PING")) {
                ws.send("PONG " + line.slice(5) + "\r\n");
                return;
            }

            // === 健壮解析 IRC 消息 ===
            let prefix = "", rest = line;
            if (line.startsWith(":")) {
                const sp = line.indexOf(" ");
                prefix = line.slice(1, sp);
                rest = line.slice(sp + 1);
            }

            // command (第一个 token)
            const sp = rest.indexOf(" ");
            const command = sp === -1 ? rest : rest.slice(0, sp);
            let afterCmd = sp === -1 ? "" : rest.slice(sp + 1);

            // content: 最后一个 " :" 之后的部分
            let content = "", target = "";
            const ci = afterCmd.lastIndexOf(" :");
            if (ci !== -1) {
                target = afterCmd.slice(0, ci);
                content = afterCmd.slice(ci + 2);
            } else {
                target = afterCmd;
            }

            // 收到 001 欢迎消息，自动加入 #main
            if (command === "001") {
                ws.send(`JOIN ${channel}\r\n`);
                connected = true;
                sendBtn.disabled = false;
                setStatus(`已连接 · ${channel}`, "connected");
                addSystemMessage("已进入频道");
                return;
            }

            // JOIN 成功 (自己或别人)
            if (command === "JOIN") {
                const nick = prefix.split("!")[0];
                addSystemMessage(`${nick} 加入了频道`);
                return;
            }

            // PART / QUIT
            if (command === "PART" || command === "QUIT") {
                const nick = prefix.split("!")[0];
                addSystemMessage(`${nick} 离开了频道${content ? " (" + content + ")" : ""}`);
                return;
            }

            // PRIVMSG 到频道
            if (command === "PRIVMSG" && target && target.startsWith("#")) {
                const nick = prefix.split("!")[0];
                addMessage(nick, content);
            }
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + 'B';
            if (bytes < 1024*1024) return (bytes/1024).toFixed(1) + 'KB';
            if (bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1) + 'MB';
            return (bytes/1024/1024/1024).toFixed(2) + 'GB';
        }

        function addMessage(nick, text) {
            const div = document.createElement('div');
            div.className = "msg";
            
            let safe = escapeHtml(text);
            // /uploads/ 链接 → 📄 文件卡片
            safe = safe.replace(/(\/uploads\/[^\s<>]+)/g, (m) => {
                const name = decodeURIComponent(m.split('/').pop());
                return `<a href="${m}" class="file-card" target="_blank">📄 ${name}</a>`;
            });
            // 图片内嵌
            safe = safe.replace(/(https?:\/\/[^\s]+\.(jpg|jpeg|png|gif|webp))/gi, '<img src="$1" alt="图片" onclick="window.open(this.src)">');
            // 普通链接
            safe = safe.replace(/(https?:\/\/[^\s<>]+)/gi, '<a href="$1" target="_blank">$1</a>');
            
            div.innerHTML = `<span class="nick">${escapeHtml(nick)}:</span>${safe}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = "msg system-msg";
            div.textContent = "* " + text;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !connected) return;
            
            ws.send(`PRIVMSG ${channel} :${text}\r\n`);
            addMessage(nickInput.value.trim() || "guest", text);
            msgInput.value = "";
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', (e) => {
            if (e.key === "Enter") sendMessage();
        });
        nickInput.addEventListener('change', () => {
            if (connected) {
                ws.send(`NICK ${nickInput.value.trim()}\r\n`);
            }
        });

        // ============ 大文件上传 ============
        function uploadFile(file) {
            if (uploading) { addSystemMessage("已有文件在上传，等待完成"); return; }
            uploading = true;
            fileBtn.disabled = true;
            uploadArea.classList.add('active');
            uploadText.textContent = `上传 ${file.name} (${formatFileSize(file.size)})...`;
            uploadBar.style.width = "0%";

            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, (c) => '%' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'));
            const xhr = new XMLHttpRequest();

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable) {
                    const pct = (e.loaded / e.total) * 100;
                    uploadBar.style.width = pct + "%";
                    uploadText.textContent = `上传 ${file.name} ${pct.toFixed(1)}% (${formatFileSize(e.loaded)} / ${formatFileSize(e.total)})`;
                }
            };
            xhr.onload = () => {
                uploading = false;
                fileBtn.disabled = !connected;
                const code = xhr.status;
                uploadBar.style.width = "100%";
                if (code === 200 || code === 201) {
                    const link = uploadBase + safeName;
                    const sizeStr = formatFileSize(file.size);
                    const sendText = `[文件] ${file.name} (${sizeStr}) ${link}`;
                    ws.send(`PRIVMSG ${channel} :${sendText}
`);
                    addMessage(nickInput.value.trim() || "guest", sendText);
                    uploadText.textContent = "✓ 上传完成: " + file.name;
                    setTimeout(() => uploadArea.classList.remove('active'), 3000);
                } else {
                    addSystemMessage(`上传失败 HTTP ${code}`);
                    uploadText.textContent = "上传失败";
                }
            };
            xhr.onerror = () => {
                uploading = false;
                fileBtn.disabled = !connected;
                addSystemMessage("上传中断（网络错误）");
                uploadText.textContent = "上传中断";
            };
            xhr.open("PUT", uploadBase + safeName, true);
            xhr.setRequestHeader("Content-Length", file.size);
            xhr.send(file);
        }

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) uploadFile(e.target.files[0]);
        });
        // 拖拽上传
        document.body.addEventListener('dragover', (e) => {
            e.preventDefault();
            document.body.classList.add('drag-over');
        });
        document.body.addEventListener('dragleave', () => document.body.classList.remove('drag-over'));
        document.body.addEventListener('drop', (e) => {
            e.preventDefault();
            document.body.classList.remove('drag-over');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
        });

        // 页面加载自动连接
        window.addEventListener('load', connect);
    </script>
</body>
</html>
